services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: maintenance_copilot_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:///./maintenance_copilot.db
      - LLM_PROVIDER=mock
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maintenance_copilot_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
